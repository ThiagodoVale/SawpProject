[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sawp"
version = "1.0.0"
description = "Reproducible pipeline for South Atlantic Warm Pool and ENEB rainfall analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Thiago Silva" }]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "xarray>=2024.6,<2025",
  "netCDF4>=1.7",
  "h5py>=3.11",
  "dask[array]>=2024.6",
  "zarr>=2.18,<3",
  "numcodecs>=0.12,<0.16",
  "matplotlib==3.10.7",
  "pillow==13.0.0",
  "cartopy>=0.23",
  "metpy>=1.6",
  "cdsapi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
gpu = ["cupy-cuda12x>=13"]

[project.scripts]
sawp = "sawp.cli:main"
sawp-generate-all = "sawp.generate_all:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

