[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sawp"
version = "1.1.0"
description = "Minimal ERA5-to-figure pipeline for SAWP and ENEB rainfall analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Thiago Silva" }]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "xarray>=2024.6,<2025",
  "netCDF4>=1.7",
  "dask[array]>=2024.6",
  "matplotlib==3.10.7",
  "pillow==13.0.0",
  "cartopy>=0.23",
  "cdsapi>=0.7.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

