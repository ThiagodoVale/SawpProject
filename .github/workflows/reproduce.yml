name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality-and-reference-capsule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/verify_capsule.py

