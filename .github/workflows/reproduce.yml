name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  artifact-capsule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.12.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python scripts/reproduce_capsule.py
      - uses: actions/upload-artifact@v4
        with:
          name: sawp-reproduction-report
          path: |
            results/reproduction_report.json
            results/figures/*.png.json

